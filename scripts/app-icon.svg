<!-- Source for public/icon-*.png (rendered at 192/512 px; content sits inside the maskable safe zone). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#020617"/>
  <!-- Content stays inside the central 80% so the maskable crop never clips it. -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#g)" stroke-width="22" opacity="0.35"/>
  <text x="256" y="256" dy="0.35em" text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="230"
        fill="url(#g)">G</text>
</svg>
